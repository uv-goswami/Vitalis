<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050810" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitCoach" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="100% private offline AI health & fitness coach" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>FitCoach AI</title>
  <style>
    /* Critical above-fold CSS to prevent flash */
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#050810;color:#e8f0ff;font-family:system-ui,sans-serif;overflow:hidden}
    #root{height:100dvh;display:flex;flex-direction:column}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script> 
    // Register service worker for PWA offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.warn);
      });
    }
  </script>
</body>
</html>
