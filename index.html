<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050810" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vitalis" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Vitalis: 100% private offline AI health & fitness coach" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>Vitalis AI</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#050810;color:#e8f0ff;font-family:system-ui,sans-serif;overflow:hidden}
    #root{height:100dvh;display:flex;flex-direction:column}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script> 
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((registration) => {
          const assets = Array.from(document.querySelectorAll('script[src], link[rel="stylesheet"]'))
                              .map(el => el.src || el.href)
                              .filter(url => url && url.startsWith(window.location.origin));
          
          if (assets.length > 0) {
            caches.open('vitalai-v4-static').then(cache => {
              cache.addAll(['/', '/index.html', '/manifest.json', ...assets]);
            });
          }
        }).catch(console.warn);
      });
    }
  </script>
</body>
</html>
